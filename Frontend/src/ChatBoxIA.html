<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JesuWithYou</title>
    <!--- Natural CSS --->
    <link rel="stylesheet" href="/Frontend/src/css/styles.css">
    <!--- Home CSS --->
    <link rel="stylesheet" href="/Frontend/src/css/chatIA.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="/Frontend/assets/imgs/JESUS.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="nav-bar">
        <div class="nav-logo">
            <h1 id="title-nav">Jesus With You</h1>
        </div>

        <div class="nav-links">
            <p id="search-bible" class="search">Bíblia</p>
            <p class="search">Estudos</p>
            <p class="search">Livros</p>
        </div>

        <div id="nav-userName">
            <span id="user-name"></span>
        </div>

        <div class="nav-actions">
            <form role="search">
                <input type="search" id="search-in-app" placeholder="Pesquisar">
                <button type="submit" id="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
            <div id="content-menu">
                <div class="central-menu" id="menu-trigger">
                    <i class="fa-solid fa-bars"></i>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div id="menu-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-item" id="theme-toggle">
                        <i class="fa-solid fa-moon"></i>
                        <p id="change-mode">Modo Claro</p>
                    </div>
                    <button id="logout-btn">Sair <i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    <button id="btn-favorites">❤ Meus Favoritos</button>
                </div>
            </div>
        </div>
    </div>
     
    <button id="btn-back"><a href="/Frontend/src/index.html">Voltar</a></button>
    <div id="chat-container">
        <p id="introduction-Text">Seja bem vindo ao ChatJesus!</p>
        <p id="_responseChat"></p>
        <div id="chat-forms">
            <form method="POST">
                <textarea id="text-action" placeholder="Digite sua ideia ou o que você deseja fazer" rows="1"></textarea>
                <button type="button" id="_submitBtnChat"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
        <div id="chat-actions">
            <div class="box-action">
                <button class="btn-send-action" id="action-config">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
            <div class="box-action">
                <button class="btn-send-action" id="action-bible">
                    <i class="fa-solid fa-book-bible"></i>
                </button>
            </div>
            <div class="box-action">
                <button class="btn-send-action" id="action-ideia">
                    <i class="fa-solid fa-pencil"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="/Frontend/src/js/ChatIA.js"></script>
</body>
</html>
