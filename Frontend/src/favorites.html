<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Meus Favoritos</title>
    <link rel="stylesheet" href="/Frontend/src/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="/Frontend/assets/imgs/JESUS.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="nav-bar">
        <div class="nav-logo">
            <h1 id="title-nav">Jesus With You</h1>
        </div>

        <div class="nav-links">
            <p class="search">Bíblia</p>
            <p class="search">Estudos</p>
            <p class="search">Livros</p>
        </div>

        <div class="nav-actions">
            <form role="search">
                <input type="search" id="search-in-app" placeholder="Pesquisar">
                <button type="submit" id="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
            <div id="content-menu">
                <div class="central-menu" id="menu-trigger">
                    <i class="fa-solid fa-bars"></i>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div id="menu-dropdown" class="dropdown-content hidden">
                    <div class="dropdown-item" id="theme-toggle">
                        <i class="fa-solid fa-moon"></i>
                        <p id="change-mode">Modo Claro</p>
                    </div>
                    <button id="logout-btn">Sair <i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                    <button id="btn-back-home">Voltar <i class="fa-solid fa-house"></i></button>
                </div>
            </div>
        </div>
    </div>
    <h1>Meus Versículos Favoritos</h1>

    <div id="favoritos-list">Carregando favoritos...</div>

    <div id="modalVersiculo" class="modal">
      <div class="modal-conteudo">
        <span class="fechar-modal">&times;</span>
        <h2 id="modal-titulo"></h2>
        <p id="modal-texto"></p>
      </div>
    </div>

    <script src="/Frontend/src/js/favorites.js"></script>
  </body>
</html>
