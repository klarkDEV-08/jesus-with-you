<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jesus With You</title>
    <link rel="stylesheet" href="/Frontend/src/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="/Frontend/assets/imgs/JESUS.png">    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="nav-bar">
        <div class="nav-logo">
            <h1 id="title-nav">Jesus With You</h1>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">Bem-vindo de volta ✝️</h1>
            <p class="login-subtitle">Entre para continuar sua jornada.</p>

            <form id="loginForm">
                <input type="email" id="email" placeholder="Seu email" required>
                <div class="input-password">
                    <input type="password" id="senha" placeholder="Sua senha" required>
                    <i class="fa-solid fa-eye" id="toggle-eye"></i>
                </div>
                <button id="submit-button" type="submit">Entrar</button>
            </form>

            <p id="login-message"></p>

            <p class="register-link">
                Não tem conta? <a href="/Frontend/src/register.html">Criar conta</a>
            </p>
        </div>
    </div>

<script src="/Frontend/src/js/login.js"></script>

</body>
</html>
