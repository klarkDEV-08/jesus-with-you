<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulo - Jesus With You</title>
    <link rel="stylesheet" href="/Frontend/src/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <link rel="stylesheet" href="/Frontend/src/css/capitulo.css">
</head>
<body>
    <div class="capitulo-container">
        <div class="capitulo-header">
            <button class="btn-voltar" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </button>
            <h1 id="titulo-capitulo">Carregando...</h1>
        </div>
        
        <div id="versiculos-list">
            <p>Carregando versículos...</p>
        </div>
        
        <div class="capitulo-nav">
            <button class="nav-btn" onclick="mudarCapitulo(-1)">
                <i class="fa-solid fa-chevron-left"></i> Anterior
            </button>
            <button class="nav-btn active" id="cap-atual">
                Cap. <span id="num-cap">1</span>
            </button>
            <button class="nav-btn" onclick="mudarCapitulo(1)">
                Próximo <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="/Frontend/src/js/capitulo.js"></script>
</body>
</html>
